<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토스증권 환전 & 평균환율 계산기</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
            background-color: #f2f4f6;
            margin: 0;
            padding: 20px;
            color: #191f28;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        }
        .summary-card {
            background: #3182f6;
            color: white;
        }
        .summary-title {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        .avg-rate {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 16px;
        }
        .sub-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 12px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #4e5968;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #d1d6db;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus {
            border-color: #3182f6;
        }
        .btn {
            width: 100%;
            background-color: #3182f6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f2f4f6;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .date-memo {
            font-size: 13px;
            color: #8b95a1;
        }
        .amounts {
            text-align: right;
            font-weight: bold;
        }
        .usd-val {
            color: #3182f6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card summary-card">
        <div class="summary-title">평균 환율 (평단가)</div>
        <div class="avg-rate" id="avgRate">0.00 원</div>
        <div class="sub-info">
            <span>총 매수: <b id="totalUsd">$0.00</b></span>
            <span>총 투입: <b id="totalKrw">0원</b></span>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top:0; margin-bottom: 16px; font-size: 18px;">환전 내역 추가</h3>
        <div class="form-group">
            <label>환전 날짜</label>
            <input type="date" id="inputDate">
        </div>
        <div class="form-group">
            <label>원화 금액 (KRW)</label>
            <input type="number" id="inputKrw" placeholder="예: 1000000">
        </div>
        <div class="form-group">
            <label>적용 환율 (원/$)</label>
            <input type="number" step="0.1" id="inputRate" placeholder="예: 1350.5">
        </div>
        <div class="form-group">
            <label>메모 (선택)</label>
            <input type="text" id="inputMemo" placeholder="예: 토스증권 환전">
        </div>
        <button class="btn" onclick="addRecord()" id="submitBtn">기록하기</button>
    </div>

    <div class="card">
        <h3 style="margin-top:0; margin-bottom: 12px; font-size: 18px;">환전 히스토리</h3>
        <div id="historyList">데이터 로딩 중...</div>
    </div>
</div>

<script>
    // ⚠️ 아래에 복사한 구글 앱스 스크립트 새 웹 앱 URL을 따옴표 안에 꼭 넣어주세요!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxLzHYUcjhIvLYiM3n5GSrduGJxP6JmMJU38_ShYA5-8asYXSfoCAlehnBQ2YquxKej7Q/exec";

    document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];

    function loadData() {
        if (!SCRIPT_URL || SCRIPT_URL.includes("여기에_구글")) {
            document.getElementById('historyList').innerText = 'SCRIPT_URL을 입력해주세요.';
            return;
        }

        fetch(SCRIPT_URL)
        .then(res => {
            if (!res.ok) throw new Error("네트워크 응답 에러");
            return res.json();
        })
        .then(data => {
            document.getElementById('avgRate').innerText = (data.summary.avgRate || 0).toFixed(2) + ' 원';
            document.getElementById('totalUsd').innerText = '$' + (data.summary.totalUsd || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('totalKrw').innerText = (data.summary.totalKrw || 0).toLocaleString() + '원';

            const listEl = document.getElementById('historyList');
            if (!data.history || data.history.length === 0) {
                listEl.innerHTML = '<div style="color:#8b95a1; text-align:center; padding: 20px 0;">기록된 내역이 없습니다.</div>';
                return;
            }

            let html = '';
            data.history.slice().reverse().forEach(item => {
                let d = item.date ? item.date.toString().substring(0, 10) : '';
                html += `
                    <div class="history-item">
                        <div>
                            <div style="font-weight: bold;">${Number(item.rate).toLocaleString()}원</div>
                            <div class="date-memo">${d} ${item.memo ? '· ' + item.memo : ''}</div>
                        </div>
                        <div class="amounts">
                            <div class="usd-val">+$${Number(item.usd).toFixed(2)}</div>
                            <div style="font-size: 12px; color: #8b95a1;">${Number(item.krw).toLocaleString()}원</div>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        })
        .catch(err => {
            console.error(err);
            document.getElementById('historyList').innerText = '데이터를 불러오지 못했습니다. 앱스 스크립트 URL 및 배포 설정을 확인하세요.';
        });
    }

    function addRecord() {
        const date = document.getElementById('inputDate').value;
        const krw = document.getElementById('inputKrw').value;
        const rate = document.getElementById('inputRate').value;
        const memo = document.getElementById('inputMemo').value;

        if (!date || !krw || !rate) {
            alert('날짜, 원화 금액, 환율을 모두 입력해 주세요!');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.innerText = '저장 중...';
        btn.disabled = true;

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // CORS 차단 방지 모드
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ date, krw, rate, memo })
        })
        .then(() => {
            btn.innerText = '기록하기';
            btn.disabled = false;
            document.getElementById('inputKrw').value = '';
            document.getElementById('inputRate').value = '';
            document.getElementById('inputMemo').value = '';
            
            // 데이터 등록 후 1초 뒤 새로고침 (구글 시트 반영 시간 고려)
            setTimeout(loadData, 1000);
        })
        .catch(err => {
            console.error(err);
            alert('저장 중 오류가 발생했습니다.');
            btn.innerText = '기록하기';
            btn.disabled = false;
        });
    }

    loadData();
</script>

</body>
</html>
