<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환율 계산기</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-body: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --primary-dark: #60a5fa;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --text-dark: #f8fafc;
            --text-gray: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
        }

        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-body); color: var(--text-dark); margin: 0; padding: 20px 16px; }
        .container { max-width: 480px; margin: 0 auto; }
        
        .tab-group { display: flex; background: var(--border); padding: 4px; border-radius: 14px; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 10px; color: var(--text-gray); font-weight: 700; cursor: pointer; }
        .tab-btn.active { background: var(--card-bg); color: var(--primary); }

        .card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); }
        .summary-card { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .avg-rate-val { font-size: 32px; font-weight: 800; color: #fff; margin: 8px 0; }
        .live-detail-bar { display: flex; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
        
        .chart-container { display: none; background: #0f172a; padding: 12px; border-radius: 14px; margin-top: 12px; height: 220px; position: relative; }
        .chart-toggle-btn { width: 100%; background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-gray); margin-bottom: 6px; font-weight: 700; }
        .form-group input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: #fff; font-size: 15px; font-weight: 700; }
        
        .btn-submit { width: 100%; background: var(--primary); color: #000; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 8px; }
        .btn-submit:disabled { opacity: 0.5; }

        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .spinner-container { display: flex; justify-content: center; padding: 20px; }
        .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="tab-group">
        <button class="tab-btn active" id="tabUSD" onclick="switchCurrency('USD')">🇺🇸 미국 달러 (USD)</button>
        <button class="tab-btn" id="tabJPY" onclick="switchCurrency('JPY')">🇯🇵 일본 엔화 (JPY)</button>
    </div>

    <div class="card summary-card">
        <div style="font-size:12px; color:#a5b4fc; font-weight:700;">📈 평균 환율</div>
        <div class="avg-rate-val" id="avgRate">0.00 원</div>
        
        <div class="live-detail-bar">
            <span>⚡ 실시간 환율</span>
            <span id="liveRateDisplay" style="font-weight:800; color:#38bdf8;">동기화 중...</span>
        </div>

        <button class="chart-toggle-btn" onclick="toggleChart()">📊 환율 변동 추이 차트 <span id="chartArrow">▼</span></button>
        <div class="chart-container" id="chartContainer">
            <canvas id="rateChart" style="width:100%; height:100%;"></canvas>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top:0;">✨ 환전 내역 추가</h3>
        <div class="form-group">
            <label>📅 날짜</label>
            <input type="date" id="inputDate">
        </div>
        <div class="form-group">
            <label>🇰🇷 원화 금액 (KRW)</label>
            <input type="number" id="inputKrw" placeholder="예: 1000000">
        </div>
        <div class="form-group">
            <label>💱 적용 환율</label>
            <input type="number" id="inputRate" step="0.01" placeholder="예: 1337.20">
        </div>
        <div class="form-group">
            <label>📝 메모</label>
            <input type="text" id="inputMemo" placeholder="메모 입력">
        </div>
        <button class="btn-submit" id="submitBtn" onclick="addRecord()">기록하기</button>
    </div>

    <div class="card">
        <h3>📜 환전 히스토리</h3>
        <div id="historyList"><div class="spinner-container"><div class="spinner"></div></div></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxLzHYUcjhIvLYiM3n5GSrduGJxP6JmMJU38_ShYA5-8asYXSfoCAlehnBQ2YquxKej7Q/exec";
    
    let currentCurrency = 'USD';
    let rawData = null;
    let chartInstance = null;

    document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];

    async function fetchLiveRate() {
        const displayEl = document.getElementById('liveRateDisplay');
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getLiveRate&t=${Date.now()}`);
            const data = await res.json();
            if (data && data[currentCurrency]) {
                displayEl.innerText = `${Number(data[currentCurrency]).toLocaleString()} 원`;
                if (!document.getElementById('inputRate').value) {
                    document.getElementById('inputRate').value = data[currentCurrency];
                }
            } else {
                displayEl.innerText = "조회 실패";
            }
        } catch (e) {
            displayEl.innerText = "연동 에러";
        }
    }

    async function loadData() {
        try {
            const res = await fetch(`${SCRIPT_URL}?t=${Date.now()}`);
            rawData = await res.json();
            renderData();
            if (document.getElementById('chartContainer').style.display === 'block') {
                renderChart();
            }
        } catch (err) {
            document.getElementById('historyList').innerText = '데이터 로드 실패';
        }
    }

    function renderData() {
        if (!rawData) return;
        const summary = rawData[currentCurrency]?.summary || { avgRate: 0 };
        const history = rawData[currentCurrency]?.history || [];

        document.getElementById('avgRate').innerText = summary.avgRate.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' 원';

        const listEl = document.getElementById('historyList');
        if (history.length === 0) {
            listEl.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8;">내역이 없습니다.</div>';
            return;
        }

        let html = '';
        history.slice().reverse().forEach((item, idx) => {
            html += `
                <div class="history-item">
                    <div>
                        <div style="font-weight:800;">${Number(item.rate).toLocaleString()} 원</div>
                        <div style="font-size:12px; color:#94a3b8;">${item.date.substring(0,10)} ${item.memo ? '· ' + item.memo : ''}</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="color:#34d399; font-weight:800;">+${Number(item.foreign).toLocaleString()}</div>
                        <div style="font-size:11px; color:#94a3b8;">${Number(item.krw).toLocaleString()} 원</div>
                    </div>
                </div>`;
        });
        listEl.innerHTML = html;
    }

    function toggleChart() {
        const container = document.getElementById('chartContainer');
        const isHidden = container.style.display !== 'block';
        container.style.display = isHidden ? 'block' : 'none';
        document.getElementById('chartArrow').innerText = isHidden ? '▲' : '▼';
        if (isHidden) setTimeout(renderChart, 50);
    }

    function renderChart() {
        const canvas = document.getElementById('rateChart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const history = rawData?.[currentCurrency]?.history || [];
        if (history.length === 0) return;

        const labels = history.map(h => h.date.substring(0, 10));
        const dataPoints = history.map(h => Number(h.rate));

        if (chartInstance) {
            chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '환율 추이',
                    data: dataPoints,
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.1)',
                    fill: true,
                    tension: 0.2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#94a3b8' } },
                    y: { ticks: { color: '#94a3b8' } }
                }
            }
        });
    }

    async function addRecord() {
        const date = document.getElementById('inputDate').value;
        const krw = document.getElementById('inputKrw').value;
        const rate = document.getElementById('inputRate').value;
        const memo = document.getElementById('inputMemo').value;

        if (!date || !krw || !rate) {
            alert('날짜, 원화 금액, 환율을 모두 입력해주세요.');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.innerText = '저장 중...';
        btn.disabled = true;

        document.getElementById('historyList').innerHTML = '<div class="spinner-container"><div class="spinner"></div></div>';

        try {
            await fetch(`${SCRIPT_URL}?action=add&currency=${currentCurrency}&date=${date}&krw=${krw}&rate=${rate}&memo=${encodeURIComponent(memo)}`, { mode: 'no-cors' });
            await new Promise(resolve => setTimeout(resolve, 1500));
            await loadData();
            
            document.getElementById('inputKrw').value = '';
            document.getElementById('inputMemo').value = '';
        } catch(e) {
            alert('저장 중 오류가 발생했습니다.');
        } finally {
            btn.innerText = '기록하기';
            btn.disabled = false;
        }
    }

    function switchCurrency(curr) {
        currentCurrency = curr;
        document.getElementById('tabUSD').classList.toggle('active', curr === 'USD');
        document.getElementById('tabJPY').classList.toggle('active', curr === 'JPY');
        document.getElementById('inputRate').value = '';
        fetchLiveRate();
        renderData();
        if (document.getElementById('chartContainer').style.display === 'block') renderChart();
    }

    fetchLiveRate();
    loadData();
</script>
</body>
</html>
