<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리가족 실시간 공유 가계부</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #45a049; }
        .total-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f5e9;
            border-radius: 6px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            border-bottom: 1px solid #eee;
            padding: 8px;
            text-align: center;
            font-size: 12px;
        }
        th { background-color: #f8f9fa; }
        .loading { text-align: center; color: #888; font-size: 13px; margin-top: 10px; }
        
        #lockScreen {
            max-width: 400px;
            margin: 100px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        #lockScreen input {
            margin-top: 15px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 18px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="lockScreen">
        <h2>🔒 우리가족 가계부</h2>
        <p style="font-size: 14px; color: #666;">가족 비밀번호를 입력해주세요.</p>
        <input type="password" id="passInput" placeholder="비밀번호" onkeydown="if(event.key === 'Enter') checkPassword()">
        <button onclick="checkPassword()">입장하기</button>
    </div>

    <div class="container" id="mainApp" style="display: none;">
        <h2>👨‍👩‍👧‍👦 우리가족 실시간 가계부</h2>
        
        <div class="form-group">
            <label>날짜</label>
            <input type="date" id="dateInput">
        </div>
        <div class="form-group">
            <label>결제자</label>
            <select id="payerInput">
                <option value="남편">남편</option>
                <option value="아내">아내</option>
                <option value="공용">공용</option>
            </select>
        </div>
        <div class="form-group">
            <label>카테고리</label>
            <select id="categoryInput">
                <option value="식비/외식">식비/외식</option>
                <option value="마트/생활">마트/생활</option>
                <option value="의료/건강">의료/건강</option>
                <option value="쇼핑/외류">쇼핑/외류</option>
                <option value="기타">기타</option>
            </select>
        </div>
        <div class="form-group">
            <label>금액 (원)</label>
            <input type="number" id="amountInput" placeholder="금액을 입력하세요">
        </div>
        <div class="form-group">
            <label>메모</label>
            <input type="text" id="memoInput" placeholder="어디서 썼나요?">
        </div>
        
        <button onclick="addExpense()" id="submitBtn">추가하기</button>
        <div class="loading" id="loadingText">데이터를 불러오는 중...</div>

        <div class="total-box" id="totalDisplay">
            총 지출: 0 원
        </div>

        <table>
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>결제자</th>
                    <th>카테고리</th>
                    <th>금액</th>
                    <th>메모</th>
                </tr>
            </thead>
            <tbody id="expenseTableBody">
            </tbody>
        </table>
    </div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyV-VjzXHVPCNcXmWBRAHAAiyIbRmzgwch74NS5eQb3HhbA1_6RMXQI9roOdTe9zANT/exec"; // 
    const FAMILY_PASSWORD = "140114"; // 

    function checkPassword() {
        const inputVal = document.getElementById('passInput').value;
        if(inputVal === FAMILY_PASSWORD) {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('dateInput').valueAsDate = new Date();
            loadData();
        } else {
            alert('비밀번호가 틀렸습니다!');
            document.getElementById('passInput').value = '';
        }
    }

    function loadData() {
        fetch(SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
            renderTable(data);
            document.getElementById('loadingText').style.display = 'none';
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('loadingText').innerText = '데이터를 불러오지 못했습니다.';
        });
    }

    function addExpense() {
        const date = document.getElementById('dateInput').value;
        const payer = document.getElementById('payerInput').value;
        const category = document.getElementById('categoryInput').value;
        const amount = Number(document.getElementById('amountInput').value);
        const memo = document.getElementById('memoInput').value;

        if (!amount) {
            alert('금액을 입력해주세요!');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.innerText = '저장 중...';
        btn.disabled = true;

        const payload = { date, payer, category, amount, memo };

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(result => {
            document.getElementById('amountInput').value = '';
            document.getElementById('memoInput').value = '';
            btn.innerText = '추가하기';
            btn.disabled = false;
            loadData();
        })
        .catch(error => {
            console.error('Error:', error);
            alert('저장에 실패했습니다.');
            btn.innerText = '추가하기';
            btn.disabled = false;
        });
    }

    function renderTable(expenses) {
        const tbody = document.getElementById('expenseTableBody');
        tbody.innerHTML = '';
        
        let total = 0;

        expenses.forEach(item => {
            const amt = Number(item.amount) || 0;
            total += amt;
            
            let dateStr = item.date;
            if(dateStr) {
                dateStr = dateStr.toString().substring(0, 10);
            }

            const row = `<tr>
                <td>${dateStr}</td>
                <td>${item.payer || ''}</td>
                <td>${item.category || ''}</td>
                <td>${amt.toLocaleString()}원</td>
                <td>${item.memo || ''}</td>
            </tr>`;
            tbody.innerHTML += row;
        });

        document.getElementById('totalDisplay').innerText = `총 지출: ${total.toLocaleString()} 원`;
    }
</script>

</body>
</html>
