<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리가족 스마트 자산 가계부</title>
    <style>
        :root {
            --bg-color: #f4f6f0;
            --card-bg: #ffffff;
            --primary-color: #3b5343;
            --text-main: #2c3e35;
            --text-sub: #7b8b80;
            --border-color: #e2e8df;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 16px;
            color: var(--text-main);
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }
        h2 { text-align: center; color: var(--primary-color); font-size: 20px; margin-bottom: 20px; }
        .asset-box {
            background: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .asset-title { font-size: 13px; opacity: 0.85; margin-bottom: 4px; }
        .asset-total { font-size: 24px; font-weight: 700; margin-bottom: 15px; }
        .asset-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.2); padding-top: 12px; font-size: 13px;
        }
        .form-section {
            background: #fafcfb; padding: 16px; border-radius: 14px;
            border: 1px solid var(--border-color); margin-bottom: 20px;
        }
        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: var(--text-sub); }
        .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip {
            padding: 8px 14px; background: white; border: 1px solid var(--border-color);
            border-radius: 20px; font-size: 13px; cursor: pointer; color: var(--text-main);
        }
        .chip.active { background: var(--primary-color); color: white; border-color: var(--primary-color); font-weight: 600; }
        input[type="date"], input[type="number"], input[type="text"] {
            width: 100%; padding: 12px; border: 1px solid var(--border-color);
            border-radius: 10px; box-sizing: border-box; font-size: 15px; background: white;
        }
        button.submit-btn {
            width: 100%; background-color: var(--primary-color); color: white;
            padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        table { width: 100%; margin-top: 15px; border-collapse: collapse; }
        th, td { padding: 10px 6px; text-align: center; font-size: 13px; border-bottom: 1px solid var(--border-color); }
        th { background-color: #f1f5f2; color: var(--text-sub); font-size: 11px; }
        #lockScreen {
            max-width: 380px; margin: 100px auto; background: white; padding: 30px;
            border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center;
        }
        #lockScreen input { margin: 15px 0; text-align: center; font-size: 20px; letter-spacing: 4px; }
    </style>
</head>
<body>

    <!-- 🔒 잠금 화면 -->
    <div id="lockScreen">
        <h2>🌿 우리가족 자산 가계부</h2>
        <p style="font-size: 13px; color: var(--text-sub);">가족 비밀번호를 입력해주세요</p>
        <input type="password" id="passInput" placeholder="••••" onkeydown="if(event.key === 'Enter') checkPassword()">
        <button class="submit-btn" onclick="checkPassword()">입장하기</button>
    </div>

    <!-- 💰 메인 화면 -->
    <div class="container" id="mainApp" style="display: none;">
        <h2>🌿 우리가족 자산 & 가계부</h2>
        
        <div class="asset-box">
            <div class="asset-title">이번 달 총 지출</div>
            <div class="asset-total" id="totalDisplay">0 원</div>
            <div class="asset-grid">
                <div>👨 남편 사용현금: <span id="husbandSpent">0원</span></div>
                <div>👩 아내 사용현금: <span id="wifeSpent">0원</span></div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-group">
                <label>날짜</label>
                <input type="date" id="dateInput">
            </div>

            <div class="form-group">
                <label>누가 썼나요?</label>
                <div class="chip-group" id="payerGroup">
                    <div class="chip active" onclick="selectPayer(this, '남편')">남편</div>
                    <div class="chip" onclick="selectPayer(this, '아내')">아내</div>
                </div>
            </div>

            <div class="form-group">
                <label>카테고리</label>
                <div class="chip-group" id="categoryGroup">
                    <div class="chip active" onclick="selectCategory(this, '식비/외식')">식비/외식</div>
                    <div class="chip" onclick="selectCategory(this, '마트/생활')">마트/생활</div>
                    <div class="chip" onclick="selectCategory(this, '교통/차량')">교통/차량</div>
                    <div class="chip" onclick="selectCategory(this, '주거/통신')">주거/통신</div>
                    <div class="chip" onclick="selectCategory(this, '의료/건강')">의료/건강</div>
                    <div class="chip" onclick="selectCategory(this, '쇼핑/의류')</i>쇼핑/의류</div>
                    <div class="chip" onclick="selectCategory(this, '문화/여가')">문화/여가</div>
                    <div class="chip" onclick="selectCategory(this, '기타')">기타</div>
                </div>
            </div>

            <div class="form-group">
                <label>금액 (원)</label>
                <input type="number" id="amountInput" placeholder="0">
            </div>

            <div class="form-group">
                <label>메모 (선택)</label>
                <input type="text" id="memoInput" placeholder="예: 주말 장보기">
            </div>
            
            <button class="submit-btn" onclick="addExpense()" id="submitBtn">지출 저장하기</button>
        </div>

        <div id="loadingText" style="text-align: center; font-size: 13px; color: var(--text-sub);">데이터 동기화 중...</div>

        <table>
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>누가</th>
                    <th>카테고리</th>
                    <th>금액</th>
                    <th>메모</th>
                </tr>
            </thead>
            <tbody id="expenseTableBody">
            </tbody>
        </table>
    </div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7or8IK90RnEaSQS7tfi96ux35MCfQblRbak0WOOtGZzbKk6pb-wymoAB6q0R-UWBq/exec";
    const FAMILY_PASSWORD = "140114";

    let selectedPayer = "남편";
    let selectedCategory = "식비/외식";

    function selectPayer(element, payer) {
        document.querySelectorAll('#payerGroup .chip').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        selectedPayer = payer;
    }

    function selectCategory(element, category) {
        document.querySelectorAll('#categoryGroup .chip').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        selectedCategory = category;
    }

    function checkPassword() {
        const inputVal = document.getElementById('passInput').value;
        if(inputVal === FAMILY_PASSWORD) {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('dateInput').valueAsDate = new Date();
            loadData();
        } else {
            alert('비밀번호가 틀렸습니다!');
            document.getElementById('passInput').value = '';
        }
    }

    // CORS 제약을 완벽히 우회하여 구글 시트 데이터를 받아오는 함수 (JSONP 방식)
    function loadData() {
        // 전역 콜백 함수 등록
        window.callback =function(data) {
            renderTable(data);
            document.getElementById('loadingText').style.display = 'none';
        };

        const script = document.createElement('script');
        script.src = `${SCRIPT_URL}?callback=callback`;
        script.onerror = () => {
            document.getElementById('loadingText').innerText = '데이터를 불러오지 못했습니다.';
        };
        document.body.appendChild(script);
    }

    function addExpense() {
        const date = document.getElementById('dateInput').value;
        const amount = Number(document.getElementById('amountInput').value);
        const memo = document.getElementById('memoInput').value;

        if (!amount) {
            alert('금액을 입력해주세요!');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.innerText = '저장 중...';
        btn.disabled = true;

        const url = `${SCRIPT_URL}?date=${encodeURIComponent(date)}&payer=${encodeURIComponent(selectedPayer)}&category=${encodeURIComponent(selectedCategory)}&amount=${encodeURIComponent(amount)}&memo=${encodeURIComponent(memo)}`;

        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = url;
        document.body.appendChild(iframe);

        setTimeout(() => {
            document.body.removeChild(iframe);
            document.getElementById('amountInput').value = '';
            document.getElementById('memoInput').value = '';
            btn.innerText = '지출 저장하기';
            btn.disabled = false;
            alert('저장되었습니다!');
            loadData(); // 데이터 다시 불러오기
        }, 1200);
    }

    function renderTable(expenses) {
        const tbody = document.getElementById('expenseTableBody');
        tbody.innerHTML = '';
        
        let total = 0;
        let husbandTotal = 0;
        let wifeTotal = 0;

        expenses.forEach(item => {
            const amt = Number(item.amount) || 0;
            total += amt;

            if(item.payer === '남편') husbandTotal += amt;
            else if(item.payer === '아내') wifeTotal += amt;
            
            let dateStr = item.date ? item.date.toString().substring(0, 10) : '';

            const row = `<tr>
                <td>${dateStr}</td>
                <td><b>${item.payer || '-'}</b></td>
                <td>${item.category || '-'}</td>
                <td>${amt.toLocaleString()}원</td>
                <td>${item.memo || ''}</td>
            </tr>`;
            tbody.innerHTML += row;
        });

        document.getElementById('totalDisplay').innerText = `${total.toLocaleString()} 원`;
        document.getElementById('husbandSpent').innerText = `${husbandTotal.toLocaleString()}원`;
        document.getElementById('wifeSpent').innerText = `${wifeTotal.toLocaleString()}원`;
    }
</script>
